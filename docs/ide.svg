<text x="32" y="118" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">#అన్తర్భావ &lt;stdio.h&gt;</text>
<text x="32" y="139" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">/* క్రమబద్ధ జాబితాలో ద్విమాన శోధన */</text>
<text x="32" y="160" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">పూర్ణాంకం ద్విమాన_శోధన(పూర్ణాంకం విలువలు[], పూర్ణాంకం లెక్క, పూర్ణాంకం కీలకం) {</text>
<text x="32" y="181" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  పూర్ణాంకం దిగువ = 0, ఎగువ = లెక్క - 1;</text>
<text x="32" y="202" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  అయితే (దిగువ &lt;= ఎగువ) {</text>
<text x="32" y="223" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    పూర్ణాంకం మధ్య = దిగువ + (ఎగువ - దిగువ) / 2;</text>
<text x="32" y="244" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    ఒకవేళ (విలువలు[మధ్య] == కీలకం) తిరిగి మధ్య;</text>
<text x="32" y="265" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    ఒకవేళ (విలువలు[మధ్య] &lt; కీలకం) దిగువ = మధ్య + 1; లేకపోతే ఎగువ = మధ్య - 1;</text>
<text x="32" y="286" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  }</text>
<text x="32" y="307" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  తిరిగి -1;</text>
<text x="32" y="328" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">}</text>
<text x="32" y="349" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">పూర్ణాంకం ప్రధాన(శూన్య) {</text>
